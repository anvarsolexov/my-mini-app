<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>VipStars Do'kon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #0f172a; color: #fff; padding: 20px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 12px 20px; margin: 10px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 80%; }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <h2>⭐️ Telegram Yulduzlarini Tanlang</h2>
    
    <!-- Hisobni to'ldirish / yulduz sotib olish tugmalari -->
    <button class="btn" onclick="buyStars('50 Yulduz - 10,000 so\'m')">50 Yulduz ⭐️</button>
    <button class="btn" onclick="buyStars('100 Yulduz - 20,000 so\'m')">100 Yulduz ⭐️</button>
    <button class="btn" onclick="buyStars('500 Yulduz - 95,000 so\'m')">500 Yulduz ⭐️</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Mini app'ni to'liq oyna qilish

        function buyStars(productName) {
            // Botga tanlangan mahsulot ma'lumotini yuborish
            tg.sendData(productName);
        }
    </script>
</body>
</html>
